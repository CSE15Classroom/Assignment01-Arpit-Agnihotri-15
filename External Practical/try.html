<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Gallery</title>
    <style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }


    body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        color: #333;
    }


    .header {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #222;
        color: white;
        padding: 20px;
        text-align: center;
    }


    .gallery {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
        padding: 20px;
    }

    
    .gallery-item {
        overflow: hidden;
        border-radius: 10px;
    }

    .gallery-item img {
        width: 100%;
        height: 100%;
        display: block;
        transition: transform 0.4s ease;
    }


    .gallery-item img:hover {
        transform: scale(1.1);
    }


    .footer {
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #222;
        color: white;
        padding: 10px;
    }




    @media (max-width: 900px) {
        .gallery {
            grid-template-columns: repeat(2, 1fr);
        }
    }

    @media (max-width: 600px) {
        .gallery {
            grid-template-columns: 1fr;
        }

        .header h1 {
            font-size: 22px;
        }

        .header p {
            font-size: 14px;
        }
    }

    </style>
</head>
<body>

    
    <header class="header">
        <h1>My Gallery</h1>
        <p>Responsive Image Gallery using Grid & Flexbox</p>
    </header>

    
    <section class="gallery">
        <div class="gallery-item"><img src="car1.jpg" alt="Image 1"></div>
        <div class="gallery-item"><img src="car2.jpg" alt="Image 2"></div>
        <div class="gallery-item"><img src="car3.jpg" alt="Image 3"></div>
        <div class="gallery-item"><img src="car4.jpg" alt="Image 4"></div>
        <div class="gallery-item"><img src="car5.jpg" alt="Image 5"></div>
        <div class="gallery-item"><img src="car6.jpg" alt="Image 6"></div>
    </section>

    
    <footer class="footer">
        <p>&copy; 2026 Responsive Gallery</p>
    </footer>

</body>
</html>
